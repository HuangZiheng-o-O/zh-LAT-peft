peft: cfg/my_lora_exp/peft/lora_kv_r8_alpha16.json

# Default env for these sparse mode batches (ENV still wins).
env_defaults:
  HP_INIT: pissa
  HP_SAVE_MODE: best_last
  HP_SAVE_FULL_MODEL: 0

# New scope:
#   - LoRA stays dense trainable (standard LoRA)
#   - sparse selection applies to base weights (global pool = all minus {g_proj,gk_proj})
sparse_selective:
  enable: true
  scope: lora_dense_base_sparse
  budget_mode: fixed_count
  # NOTE: this K applies only to base sparse deltas; total trainables = dense_LoRA + K
  k: 7569408
  score_samples: 1024

