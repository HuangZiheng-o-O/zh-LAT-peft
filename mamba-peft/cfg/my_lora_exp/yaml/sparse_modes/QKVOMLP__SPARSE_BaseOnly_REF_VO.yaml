peft: cfg/my_lora_exp/peft/lora_qkvo_plus_mlp_r8_alpha16.json

env_defaults:
  HP_INIT: pissa
  HP_SAVE_MODE: best_last
  HP_SAVE_FULL_MODEL: 0

# Design:
# - Candidate pool = base weights for QKVO+MLP (LoRA is NOT injected in base_only)
# - Sparse selection happens within base weights only
# - Budget matches the dense LoRA trainable count of VO-only reference
sparse_selective:
  enable: true
  scope: base_only
  budget_mode: match_reference
  reference_cfg: cfg/my_lora_exp/yaml/E6_VOONLY_r8_alpha16.yaml
  score_samples: 1024

