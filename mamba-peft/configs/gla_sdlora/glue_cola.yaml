# GLA SD-LoRA Training Configuration for GLUE CoLA
# Usage: python train_gla_sdlora.py --cfg configs/gla_sdlora/glue_cola.yaml

model: "fla-hub/gla-1.3B-100B"
data: "glue-tvt_cola"
val_data_split: "val"

# Training hyperparameters
num_epochs: 10
batch_size: 8
learning_rate: 5e-4
gradient_accumulation_steps: 1
eval_epochs: 1

# Precision
prec: "bf16"

# Random seed
seed: 42

# Evaluation
skip_eval: false
no_save: false

# Generation (not needed for classification)
eval_gen: null
